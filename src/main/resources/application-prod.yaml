spring:
  application:
    name: seowonfc-api

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:xxxxx}
  api-key: ${CLOUDINARY_API_KEY:xxxxx}
  api-secret: ${CLOUDINARY_API_SECRET:xxxxx}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
