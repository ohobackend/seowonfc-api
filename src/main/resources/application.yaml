spring:
  application:
    name: seowonfc-api

  datasource:
    url: jdbc:postgresql://localhost:5432/seowonfc
    username: postgres
    password: ${DB_PASSWORD:167181}   # STEP 3에서 설정한 비밀번호로 변경
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update        # 엔티티 기준으로 테이블 자동 생성/수정 (개발 단계용)
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

jwt:
  secret: seowonfc-local-dev-secret-key-change-this-later-1234567890

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:xxxxx}
  api-key: ${CLOUDINARY_API_KEY:xxxxx}
  api-secret: ${CLOUDINARY_API_SECRET:xxxxx}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha